    target_gbp: 1000000
    by: 2027-12-31                    # "end of next year" from 2026-08-16
  fixed_commitments:
    - name: Rent
      amount: TODO
      day_of_month: TODO
    - name: Gym membership
      amount: TODO
      day_of_month: TODO
