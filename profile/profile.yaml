# Life OS — Owner Profile
#
# The single source of truth. Every agent reads this before acting.
# Fields marked TODO are unanswered; agents must ask rather than assume.
#
# NEVER store here: account numbers, API keys, access tokens, passwords,
# full dates of birth, or anything else that would be damaging in a leaked repo.

meta:
  last_updated: 2026-08-16
  interview_rounds_complete: [1, 2]   # e.g. [1, 2, 3]
  region: United Kingdom              # determines banking & health API options
  timezone: Europe/London
  general_area: London (Mitcham)      # city-level only, for local-service automation
                                       # (grocery delivery, tradespeople). Full street
                                       # address deliberately not stored here — see the
                                       # no-secrets note at the top of this file; keep
                                       # anything more precise in the automation
                                       # platform's vault if a specific integration
                                       # ever needs it.

# ── Round 1 ──────────────────────────────────────────────────────────────────
orientation:
  # Owner found "pick one" hard to answer cleanly — the honest answer was four
  # concrete workstreams, not one outcome. Keeping all four rather than forcing
  # a false single priority; ranking happens in the priorities list below.
  ninety_day_objective:
    - finance_oversight: "Better visibility into finances, with someone/something reviewing spend and flagging where money could be handled better."
    - ai_workout_coach: "Replace a paid monthly service that programs workouts with an AI-driven equivalent."
    - grocery_automation: "Automate grocery ordering — already discussed separately with Claude, treat as an existing thread to fold in."
    - gift_buying: "Struggles to choose/purchase gifts for family members — wants this taken off his plate."
  known_leaks:
    - "Doctor's appointment for a lingering chest infection never got booked. Mostly recovered but still flares up under high-output effort (beach volleyball) and when talking/laughing — affects breathing capacity in the moment."
    - "Cleaner never got scheduled to come to the flat."

# Ranked, no ties. Arbitration rule 1 depends on this ordering.
# Owner flagged this as a vibe check, not a fixed law — CEO agent has standing
# permission to notice when the ranking looks stale and propose a re-rank
# rather than waiting for the quarterly re-plan.
priorities:
  - finance                           # 1st
  - health
  - hobbies
  - relationships
  - ai

stack:
  phone: ios                          # iPhone 16
  wearable: none
  sleep_device: eight_sleep_pod4       # in-bed sensor, not worn -- covers sleep/recovery
                                       # in place of a wearable. Integration path TBD:
                                       # no fully public Eight Sleep API; likely route is
                                       # its Apple Health sleep-stage export given the
                                       # iPhone. Revisit in Round 5.
  smart_scale: withings                # + a Withings BPM (blood pressure) device
  notes_and_tasks: apple_notes         # currently just jotted ideas, not kept up to date.
                                       # Owner is open to switching -- recommendation:
                                       # Notion as the structured Life OS ledger (already
                                       # the designated ledger in the architecture and it's
                                       # a live connector), Apple Notes stays for loose
                                       # personal jotting. Confirm before treating as final.
  automation_platform: TODO           # make | n8n | zapier | none yet
  desktop: windows                    # laptop, new high-spec unit arriving next week
  live_connectors: [gmail, google_calendar, google_drive, notion, github]

# ── Rounds 2–3 ───────────────────────────────────────────────────────────────
finance:
  income_sources:
    - name: Salary
      cadence: monthly
      variable: false
      amount_annual_gbp: 60000        # approximate, per owner ("something around 60K")
    - name: Internet bill (expensed)
      cadence: monthly
      variable: false
      note: "Reimbursed by employer -- reduces effective cost rather than adding income."
    - name: Savings account interest
      cadence: variable
      variable: true
  headline_metric:
    name: net_worth
    current_gbp: 150000                # AMBIGUOUS -- owner said "~150K" then separately
                                       # mentioned a ~50K pension. Unclear if the 150K
                                       # already includes the pension or is on top of it
                                       # (i.e. true current net worth may be ~150K or
                                       # ~200K). Confirm before treating either as solid --
                                       # it changes the required monthly delta to hit
                                       # the target materially.
    target_gbp: 1000000
    by: 2027-12-31                    # "end of next year" from 2026-08-16
  fixed_commitments:
    - name: Rent
      amount: TODO
      day_of_month: TODO
    - name: Gym membership
      amount: TODO
      day_of_month: TODO
    - name: Virgin Media (internet)
      amount: TODO
      day_of_month: TODO
      note: "This is the bill expensed via employer above -- outgoing here, reimbursed as income there."
    - name: Beach volleyball coach
      amount: TODO
      day_of_month: TODO
    - name: Cleaner
      amount: TODO
      day_of_month: TODO
      note: "Flagged under known_leaks -- visits haven't actually been scheduled recently, so this commitment may be lapsed rather than active. Worth confirming which is true."
  debts: []                           # confirmed: no debt of any kind
  accounts:                           # names only, never numbers -- 10 institutions is a lot
                                       # of surface area; matters for aggregator coverage below
    - {institution: Virgin Money, type: main current account}
    - {institution: Chase, type: payments/current account}
    - {institution: Monzo, type: current account}
    - {institution: LifeStage Money, type: savings/investment app}
    - {institution: First Direct, type: dormant/lingering account}
    - {institution: NatWest, type: dormant/lingering account}
    - {institution: Chip, type: savings app}
    - {institution: PayPal, type: payments}
    - {institution: Revolut, type: current account/card}
    - institution: Aviva (MyAviva)
      type: pension
      note: "~50K, see current_gbp ambiguity above. Owner recalls API/open-banking
        access existing at one point, unsure if still active. Researched: Aviva
        runs a developer portal (developer.aviva.co.uk) but it's oriented at
        pension-provider/payroll B2B integration, not confirmed consumer AIS via
        aggregators. No solid public confirmation either way. Practical next step
        is checking the MyAviva portal/app directly for an open-banking consent
        option, or contacting Aviva support -- owner offered to help obtain
        access if possible, worth doing once other Round 3 items are settled."
  aggregator: moneyhub (leading candidate, not yet confirmed)
    # Both TrueLayer and Plaid are developer platforms, not individual
    # self-serve products -- either would mean registering as a developer and
    # building the integration. Moneyhub looks like the better single fit:
    # UK bank aggregation + pension aggregation (solves the Aviva access
    # question in one provider) + it's the first non-shareholder participant
    # in the UK's new cVRP payment scheme (relevant to the Mark/Justyna
    # payment automation). Caveat: Moneyhub reads as enterprise/B2B-oriented
    # too -- individual signup path not yet confirmed. Owner to check
    # moneyhub.com before this is locked in.
  categories: []                      # owner prefers 8-12 buckets (the recommended default),
                                       # open to more granularity if it proves useful. To be
                                       # proposed from real transaction history once the
                                       # aggregator is live rather than invented upfront.
  agent_write_access: false           # keep false until it's been right for a quarter

  # Owner wants two specific payees automated -- flagged as its own item rather
  # than folded into agent_write_access, because it changes the guardrail in
  # operating.never_without_asking ("spend money") for these two people
  # specifically. Owner explicitly confirmed he's happy with the draft-and-
  # approve v1 (not silent auto-send) after hearing why full unattended send
  # isn't realistically available yet on UK consumer banking -- see
  # payment_rails_research below. Not built yet.
  payment_automation_requested:
    v1_model: draft_and_approve          # owner-confirmed; not silent auto-send
    payees:
      - payee: Mark (beach volleyball coach)
        trigger: "A calendar event with Mark has passed"
        amount_rule: "GBP 50 x the event's duration in hours. Owner pays Mark
          the FULL amount every time regardless of headcount (corrected from
          an earlier assumption of a split) -- so this side needs only the
          calendar event and its duration, no attendance data."
        reimbursement: "Separately, other players who trained that session pay
          the owner back their share. No attendee list exists (events aren't
          sent as invites) and there's no WhatsApp access to infer headcount.
          Proposed fix, pending owner confirmation: owner adds player count to
          the event title/description (e.g. 'Beach Volleyball w/ Mark --
          3 players') when creating it -- calendar connector can read that
          directly, no new tooling needed."
        status: "Mark's own-payment side is fully specced; reimbursement side
          pending the event-title convention being confirmed/adopted"
      - payee: Justyna (cleaner)
        trigger: TODO                   # presumably per completed visit -- not yet asked
        amount_rule: TODO               # rate not yet captured (see fixed_commitments.Cleaner)
        status: requirements captured, not designed
    note: "Owner open to adding more payees later, or a lighter-weight version
      that just prompts for these payments rather than drafting them --
      his words: 'we'll see'."

  payment_rails_research:
    date: 2026-08-16
    finding: "UK 'commercial VRP' (variable recurring payments to third-party
      payees, not just your own accounts) is brand new infrastructure -- the
      UK Payments Initiative (UKPI) cVRP scheme's first live payments were only
      expected Q1 2026. It requires the receiving payee's bank/PISP to support
      it too, which a personal coach or cleaner almost certainly won't. So
      genuine unattended auto-pay to Mark and Justyna isn't realistically
      buildable right now through standard consumer banking. A payment
      link/reminder that the owner approves with one tap (via Monzo, Revolut,
      or a bank transfer draft) is the realistic near-term version."

