# Life OS — Owner Profile
#
# The single source of truth. Every agent reads this before acting.
# Fields marked TODO are unanswered; agents must ask rather than assume.
#
# NEVER store here: account numbers, API keys, access tokens, passwords,
# full dates of birth, or anything else that would be damaging in a leaked repo.

meta:
  last_updated: 2026-08-16
  interview_rounds_complete: [1, 2]   # e.g. [1, 2, 3]
  region: United Kingdom              # determines banking & health API options
  timezone: Europe/London
  general_area: London (Mitcham)      # city-level only, for local-service automation
                                       # (grocery delivery, tradespeople). Full street
                                       # address deliberately not stored here — see the
                                       # no-secrets note at the top of this file; keep
                                       # anything more precise in the automation
                                       # platform's vault if a specific integration
                                       # ever needs it.

# ── Round 1 ──────────────────────────────────────────────────────────────────
orientation:
  # Owner found "pick one" hard to answer cleanly — the honest answer was four
  # concrete workstreams, not one outcome. Keeping all four rather than forcing
  # a false single priority; ranking happens in the priorities list below.
  ninety_day_objective:
    - finance_oversight: "Better visibility into finances, with someone/something reviewing spend and flagging where money could be handled better."
    - ai_workout_coach: "Replace a paid monthly service that programs workouts with an AI-driven equivalent."
    - grocery_automation: "See the dedicated grocery_automation section below -- this
        thread turned out to already have a real technical plan behind it, found in
        the owner's Drive, not just a stated intention."
    - gift_buying: "Struggles to choose/purchase gifts for family members — wants this taken off his plate."
  known_leaks:
    - "Doctor's appointment for a lingering chest infection never got booked. Mostly recovered but still flares up under high-output effort (beach volleyball) and when talking/laughing — affects breathing capacity in the moment."
    - "Cleaner never got scheduled to come to the flat."

# Found 2026-08-16 in the owner's Drive -- a prior Claude session had already
# scoped this in real detail. Source doc:
# https://docs.google.com/document/d/1DqRafroQ9ulZkdy085o5ZSXZs1qInXrWAjfcq9lNTic
# Full item-level order history lives in that other session's chat history, not
# duplicated here -- this is a summary, treat the doc as the source of truth.
grocery_automation:
  status: scoped, not built
  household: owner only, single household
  automation_level: "Fully automatic basket build + delivery slot selection.
    Owner handles final payment/checkout himself -- the agent must stop once
    the basket is filled and a slot is reserved, never proceeding to payment.
    This is a hard boundary, not a preference."
  retailer: Sainsbury's
  diet_goal: high protein / muscle gain
  budget: no fixed cap
  cadence: weekly
  technical_findings:
    - "No public Sainsbury's API for personal/consumer use -- rules out a
      clean API integration."
    - "No Sainsbury's or grocery MCP connector available in Claude's
      connector directory (checked)."
    - "Chosen mechanism: Claude in Chrome, browsing the live site directly.
      Will NOT enter login credentials on the owner's behalf (security
      boundary) -- owner logs in himself, then it continues."
    - "Requires a live, open Chrome session on the owner's machine at run
      time -- cannot run purely in the cloud. Cowork's scheduled triggers can
      fire from the cloud, but the actual basket-filling step still needs the
      owner's computer awake and Chrome open when it runs. 'Unattended' in
      practice means the owner leaves the machine on/Chrome open on shop day,
      or kicks it off manually that morning."
  staples_draft: "Derived from 10 orders (10 Apr - 27 Jul 2026): near-certain
    staples include bananas, British beef mince, Eatlean protein grated
    cheese, sweet potato, eggs, salmon poke, red onions, avocados. A full
    proposed weekly list exists in the source doc. NOT yet confirmed by the
    owner -- treat as a draft."
  open_decisions:
    - "Staples list not yet confirmed/edited by owner"
    - "No delivery slot preference (day/time/saver-slot-ok) captured yet"
    - "Substitution rule for out-of-stock items not yet discussed"
    - "Exact mechanics for guaranteeing the stop-before-payment boundary not
      yet fully defined"

# Ranked, no ties. Arbitration rule 1 depends on this ordering.
